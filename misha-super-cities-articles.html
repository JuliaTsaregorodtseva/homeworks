<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Misha · Super Cities · Articles &amp; city vocabulary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2B3456; --ink2:#3D4A78; --paper:#F7F3EC; --card:#FFFFFF; --tint:#F0ECE4;
  --must:#F2B84B; --must-soft:#FCEFD4; --crim:#C9533F; --crim-soft:#F8E1DB;
  --teal:#5E9A7E; --teal-soft:#E1EFE7; --pink:#D97C6C; --pink-soft:#F8E4DF;
  --muted:#636A7E; --line:#E2DCD1; --ru:#7A7F90;
  --r:16px; --shadow:0 2px 10px rgba(43,52,86,.08);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Nunito",system-ui,sans-serif;font-size:17px;line-height:1.45}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--must);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:"Unbounded","Nunito",sans-serif;line-height:1.2;margin:0}
.ru{color:var(--ru);font-size:.88em;display:block;font-weight:600}
.ru-i{color:var(--ru);font-weight:600}
.muted{color:var(--muted)}

/* header */
header.hero{background:var(--ink);color:#fff;padding:26px 0 22px;position:relative;overflow:hidden}
.hero .kick{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--pink);font-weight:800}
.hero .ecg{position:absolute;left:0;bottom:0;width:100%;height:64px;opacity:.95;pointer-events:none}
header.hero{padding-bottom:76px!important}
.cgap{display:inline-block;min-width:54px;border-bottom:2.5px solid var(--must);text-align:center;font-weight:800;color:var(--muted);padding:0 4px}
.cgap.ok{color:var(--teal);border-color:var(--teal)}
.cgap.no{color:var(--crim);border-color:var(--crim)}
.vid{display:inline-flex;align-items:center;gap:6px;margin:4px 0 10px;font-weight:800;color:var(--crim);text-decoration:none;min-height:44px}
.hero h1{font-size:clamp(24px,6vw,38px);margin:8px 0 6px}
.hero p{margin:4px 0;color:#D5D9E6}
.hero .ru{color:#AEB5C9}
.hero .badge{position:absolute;right:-30px;top:-30px;width:170px;height:170px;border-radius:50%;background:var(--teal);opacity:.25}
.namebox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.namebox label{font-weight:700;font-size:15px}
.namebox input{background:#fff;color:var(--ink);border:0;border-radius:12px;padding:10px 14px;min-height:44px;width:200px}
.howto{margin-top:12px;background:rgba(255,255,255,.08);border-radius:12px;padding:10px 14px;font-size:15px}

/* sticky bar */
.bar{position:sticky;top:0;z-index:20;background:rgba(247,245,239,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.prog{display:flex;align-items:center;gap:12px;padding:10px 0 6px}
.track{flex:1;height:12px;border-radius:99px;background:var(--tint);overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--must));border-radius:99px;transition:width .4s}
.score{font-weight:800;white-space:nowrap;font-size:15px}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:thin}
nav.tabs button{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;min-height:44px;font-weight:700;font-size:14px;line-height:1.1;text-align:center}
nav.tabs button small{display:block;font-size:11px;color:var(--ru);font-weight:700}
nav.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
nav.tabs button.on small{color:#C9CEDD}
nav.tabs button .ts{display:inline-block;margin-left:6px;background:var(--teal);color:#fff;border-radius:99px;padding:0 7px;font-size:11px}

main{padding:18px 0 60px}
section.panel{display:none}
section.panel.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ptitle{display:flex;align-items:center;gap:12px;margin:6px 0 14px}
.ptitle .ic{width:52px;height:52px;border-radius:50%;background:var(--ink);display:grid;place-items:center;font-size:26px;flex:0 0 auto}
.ptitle h2{font-size:clamp(19px,4.6vw,26px)}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;margin:0 0 16px}
.card h3{font-size:17px;margin-bottom:8px}
.case-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:6px}
.case-head h3{font-size:17px}
.instr{margin:2px 0 12px;font-weight:700}
.stamp{flex:0 0 auto;border:2.5px solid var(--crim);color:var(--crim);border-radius:8px;padding:2px 8px;font-family:"Unbounded";font-size:11px;transform:rotate(-6deg);display:none;white-space:nowrap}
.stamp.show{display:inline-block}

/* rules */
.rule{border-radius:var(--r);padding:16px 18px;margin-bottom:16px;background:#fff;box-shadow:var(--shadow)}
.rule h3{font-size:18px;margin-bottom:8px;color:var(--ink)}
.rule p{margin:6px 0}
table.form{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:16px}
table.form td{padding:8px 10px;background:var(--tint);vertical-align:top}
table.form td:first-child{border-radius:10px 0 0 10px;font-weight:800;width:42px;text-align:center}
table.form td:last-child{border-radius:0 10px 10px 0}
table.form.wide td:first-child{width:auto;white-space:nowrap;text-align:left;color:var(--ink2)}
.hl{background:var(--must-soft);border-radius:5px;padding:0 3px;font-weight:800}
.hl2{background:var(--teal-soft);border-radius:5px;padding:0 3px;font-weight:800}
.say{border:0;background:var(--tint);border-radius:50%;width:36px;height:36px;min-width:36px;display:inline-grid;place-items:center;font-size:16px;vertical-align:middle;margin-left:4px}
.exrow{display:flex;align-items:center;gap:8px;margin:6px 0;flex-wrap:wrap}
.mist{display:grid;grid-template-columns:1fr;gap:6px;margin-top:8px}
.mist div{background:var(--tint);border-radius:10px;padding:8px 12px;font-size:16px}
.bad{color:var(--crim);text-decoration:line-through;text-decoration-thickness:1.5px}
.good{color:var(--teal);font-weight:800}
.machine{background:var(--ink);color:#fff;border-radius:var(--r);padding:16px 18px}
.machine .out{font-size:clamp(20px,5vw,28px);font-weight:800;min-height:46px;margin:12px 0 6px}
.machine .out .d{color:var(--must)} .machine .out .b{color:#8FE3CF;text-decoration:underline}
.machine .btns{display:flex;gap:8px;flex-wrap:wrap}
.machine button{border:0;border-radius:12px;padding:10px 16px;min-height:44px;font-weight:800;background:#2E3A5C;color:#fff}
.machine button.on{background:var(--must);color:var(--ink)}
.machine .note{font-size:14px;color:#C9CEDD;margin-top:6px}

/* words */
.wgroup h3{font-size:16px;margin:0 0 10px}
.wlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.w{display:flex;align-items:center;gap:10px;background:var(--tint);border-radius:12px;padding:8px 10px}
.w .em{font-size:24px;width:32px;text-align:center}
.w b{display:block}
.careful{background:var(--must-soft);border-radius:var(--r);padding:14px 18px;margin-bottom:16px}
.careful h3{font-size:16px;margin-bottom:6px}
.careful ul{margin:4px 0;padding-left:20px}

/* flashcards */
.fc-tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;min-height:44px;font-weight:700;font-size:14px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.flip{perspective:1200px;height:270px;margin:6px 0 12px}
.flip .in{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d;cursor:pointer}
.flip.turned .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center;box-shadow:var(--shadow)}
.face.front{background:#fff;border:2px solid var(--line)}
.face.back{background:var(--ink);color:#fff;transform:rotateY(180deg)}
.face .big{font-size:clamp(26px,7vw,38px);font-weight:900;font-family:"Unbounded"}
.face .em{font-size:52px;line-height:1}
.face .ex{margin-top:10px;font-size:16px;color:#D5D9E6}
.face .hint{position:absolute;bottom:10px;font-size:12px;color:var(--muted)}
.face.back .hint{color:#AEB5C9}
.fc-nav{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.fc-nav button{flex:1;min-width:120px;min-height:48px;border-radius:14px;border:0;font-weight:800}
.b-know{background:var(--teal);color:#fff}.b-learn{background:var(--must);color:var(--ink)}.b-plain{background:#fff;border:1.5px solid var(--line)!important}
.fc-count{text-align:center;font-weight:800;margin:8px 0}

/* items */
.item{border-top:1px dashed var(--line);padding:12px 0}
.item:first-of-type{border-top:0}
.q{font-size:18px;font-weight:700;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start}
.q .n{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;font-size:14px;display:grid;place-items:center;margin-top:1px}
.gap{display:inline-block;min-width:70px;border-bottom:2.5px solid var(--muted);margin:0 3px}
.gap.ok{border-color:var(--teal);color:var(--teal);font-weight:900;min-width:0}
.gap.suf{margin-left:0}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-left:40px}
.opt{border:2px solid var(--line);background:#fff;border-radius:14px;padding:9px 16px;min-height:46px;font-weight:800;font-size:16px;transition:transform .1s}
.opt:active{transform:scale(.97)}
.opt.right{background:var(--teal);border-color:var(--teal);color:#fff}
.opt.wrong{background:var(--crim-soft);border-color:var(--crim);color:var(--crim)}
.opt[disabled]{cursor:default}
.fb{margin:8px 0 0 40px;font-size:15px;border-radius:10px;padding:8px 12px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--teal-soft)} .fb.no{background:var(--crim-soft)}
.fb .why{display:block;color:var(--muted);margin-top:2px}
.pic{margin-left:40px;margin-bottom:8px}
.emo{font-size:56px;line-height:1}
.tin{display:flex;gap:8px;margin-left:40px;flex-wrap:wrap}
.tin input{flex:1;min-width:200px;border:2px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px;background:#fff}
.tin input.ok{border-color:var(--teal);background:var(--teal-soft)}
.tin input.no{border-color:var(--crim);background:var(--crim-soft)}
.btn{border:0;border-radius:12px;padding:10px 18px;min-height:46px;font-weight:800;background:var(--ink);color:#fff}
.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn.gold{background:var(--must);color:var(--ink)}
.btn.teal{background:var(--teal);color:#fff}
.btn[disabled]{opacity:.45;cursor:default}
.listen{border:0;background:var(--pink);color:#fff;border-radius:16px;min-height:56px;padding:8px 20px;font-weight:900;font-size:18px;margin-left:40px;margin-bottom:8px}
.syl .opt{border-radius:10px;min-width:64px;font-family:"Unbounded",system-ui,sans-serif;font-weight:600}
.syl{gap:4px}
.sortw{display:flex;align-items:center;gap:8px;margin-left:40px;margin-bottom:8px;font-size:20px;font-weight:900}
.mono{font-family:"Nunito",system-ui,sans-serif;font-weight:800}

/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:8px}
.mt{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;min-height:48px;font-weight:800;text-align:left}
.mt.sel{border-color:var(--must);background:var(--must-soft)}
.mt.done{border-color:var(--teal);background:var(--teal-soft);color:#155e55;cursor:default}
.mt.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* tiles */
.line{min-height:56px;border:2px dashed var(--line);border-radius:12px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px 40px;background:#fff}
.pool{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px 40px}
.tile{border:0;background:var(--ink2);color:#fff;border-radius:10px;padding:8px 12px;min-height:44px;font-weight:800}
.line .tile{background:var(--must);color:var(--ink)}
.tilebtns{display:flex;gap:8px;margin-left:40px;flex-wrap:wrap}

/* story */
.story{background:#FFFDF6;border:2px solid var(--must-soft);border-radius:var(--r);padding:16px 18px;font-size:17px;line-height:1.65}
.story h3{font-family:"Unbounded";font-size:18px;margin-bottom:6px}
.gl{border-bottom:2px dotted var(--must);cursor:pointer;background:none;border-top:0;border-left:0;border-right:0;padding:0;font-weight:700;min-height:0}
.gl .tip{display:none;font-size:13px;color:var(--ru);font-weight:700;margin-left:4px}
.gl.open .tip{display:inline}

textarea{width:100%;min-height:130px;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;resize:vertical}
.wc{font-size:13px;color:var(--muted);margin-top:4px}

/* results */
.big-score{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.ring{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--teal) 0deg,var(--tint) 0deg);flex:0 0 auto}
.ring span{width:94px;height:94px;border-radius:50%;background:#fff;display:grid;place-items:center;font-family:"Unbounded";font-size:22px}
.rank{font-family:"Unbounded";font-size:20px}
.brk{width:100%;border-collapse:collapse;font-size:15px}
.brk td{padding:7px 6px;border-bottom:1px solid var(--line)}
.brk td:last-child{text-align:right;font-weight:800;white-space:nowrap}
.mlist div{background:var(--tint);border-radius:10px;padding:8px 12px;margin-bottom:6px;font-size:15px}
.send{display:flex;flex-wrap:wrap;gap:8px}
.send a,.send button{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:10px 16px;border-radius:12px;font-weight:800;text-decoration:none;border:0}
.s-share{background:var(--ink);color:#fff}.s-gm{background:#EA4335;color:#fff}.s-tg{background:#229ED9;color:#fff}.s-wa{background:#25D366;color:#fff}.s-ml{background:#fff;color:var(--ink);border:2px solid var(--line)!important}.s-cp{background:var(--must);color:var(--ink)}
.email{user-select:all;font-weight:800;background:var(--tint);padding:2px 8px;border-radius:6px}
.confirm{display:none;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.confirm.show{display:flex}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:10px 16px;font-weight:800;display:none;z-index:50}
.toast.show{display:block}
.next{display:flex;justify-content:flex-end;margin-top:8px}

/* preposition scenes */
svg.scene{width:170px;height:120px;background:var(--tint);border-radius:14px}

@media (max-width:520px){
  table.form.wide td:first-child{white-space:normal;width:32%}
  .opts,.fb,.tin,.pic,.line,.pool,.tilebtns,.listen,.sortw{margin-left:0}
  .match{grid-template-columns:1fr 1fr;gap:6px}
  .mt{font-size:15px;padding:8px}
  .card{padding:14px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
/* ================= DATA ================= */
const TEACHER = "ulchik2211@gmail.com";
const TOPIC = "Super Cities: articles & city vocabulary";
const STORE = "misha-super-cities-articles-v1";
const DEFAULT_NAME = "Misha";
const VIDEO_URL = "https://www.youtube.com/watch?v=Hy4QjmKzF1c";

const WORDS = [
  {g:"text", en:"sprawling", ru:"spreading out over a large area, often without a plan (adj)", em:"🗺️", ex:"Phoenix is a sprawling city where you need a car for everything."},
  {g:"text", en:"bleak", ru:"cold, empty and depressing (adj)", em:"🌫️", ex:"The business district feels bleak at the weekend."},
  {g:"text", en:"compact", ru:"small, with everything close together (adj)", em:"🧩", ex:"Barcelona's old centre is compact and easy to explore on foot."},
  {g:"text", en:"skyline", ru:"the shape that buildings make against the sky (n)", em:"🌆", ex:"The new tower has completely changed the city's skyline."},
  {g:"text", en:"wander (around)", ru:"to walk slowly without a clear direction (v)", em:"🚶", ex:"We spent the afternoon wandering around the old town."},
  {g:"text", en:"prioritise", ru:"to treat something as more important than other things (v)", em:"🥇", ex:"The council should prioritise pedestrians over cars."},
  {g:"text", en:"locally sourced", ru:"produced or found in the local area (adj)", em:"🧱", ex:"The houses are built from locally sourced stone."},
  {g:"text", en:"sameness", ru:"the quality of being just like everything else (n)", em:"🏢", ex:"The sameness of modern airports is depressing."},
  {g:"more", en:"high-rise", ru:"a very tall building with many floors (n / adj)", em:"🏙️", ex:"They live on the 30th floor of a high-rise."},
  {g:"more", en:"landmark", ru:"a famous building or place that is easy to recognise (n)", em:"🗼", ex:"Tower Bridge is one of London's most famous landmarks."},
  {g:"more", en:"pedestrianised", ru:"closed to cars so that only people on foot can use it (adj)", em:"🚸", ex:"The main street was pedestrianised ten years ago."},
  {g:"more", en:"run-down", ru:"in poor condition because nobody has looked after it (adj)", em:"🏚️", ex:"The station area used to be run-down, but it's changing fast."},
  {g:"more", en:"bustling", ru:"busy and full of people moving around (adj)", em:"🛍️", ex:"We had lunch in a bustling market square."},
  {g:"more", en:"vibrant", ru:"full of energy, life and activity (adj)", em:"🎉", ex:"The city has a vibrant street-food scene."},
];
const GROUPS = {text:["From the reading","de Botton's article"], more:["More words to describe cities","useful for talking about your city"]};
const CAREFUL = [
  "<b>wander</b> /ˈwɒndə/ (walk around) ≠ <b>wonder</b> /ˈwʌndə/ (think, ask yourself).",
  "<b>prioritise</b> (British) = <b>prioritize</b> (American and also common in the UK). Both are correct.",

function markFC(k){

function qLine(n, html){ return el("div",{class:"q"}, el("span",{class:"n"}, String(n)), el("span",{html})); }
function gapHtml(q, fill){ const suf = /\w___/.test(q) ? " suf" : ""; return esc(q).replace("___", fill ? `<span class="gap ok${suf}">${esc(fill)}</span>` : `<span class="gap${suf}">&nbsp;</span>`); }
function fbBox(){ return el("div",{class:"fb"}); }
function showFb(fb, ok, why, extra){
  fb.className = "fb show " + (ok ? "ok" : "no");
  fb.innerHTML = `<b>${ok ? pick(PRAISE) : pick(OOPS)}</b>${extra ? " "+extra : ""}${why ? `<span class="why">${why}</span>` : ""}`;
}

function choiceItem(ex, it, i){
  const id = ex.id+"-"+i, wrap = el("div",{class:"item"});
  const st = S.ans[id];
  let qEl;
  if(ex.sort) qEl = el("div",{class:"sortw"}, el("span",{class:"n", style:"width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;font-size:14px;display:grid;place-items:center"}, String(i+1)), it.word, sayBtn(it.word));
  else if(ex.syl) qEl = qLine(i+1, `<span class="mono">${esc(it.word)}</span>`);
  else if(ex.listen) qEl = qLine(i+1, "Which word do you hear?");
  else qEl = qLine(i+1, gapHtml(it.q, st && st.done ? it.o[it.a].replace(/^-/,"") : null));
  wrap.appendChild(qEl);
  if(ex.syl) wrap.appendChild(el("div",{style:"margin:-2px 0 8px 40px"}, sayBtn(it.word)));
  if(it.pic) wrap.appendChild(el("div",{class:"pic"}, el("span",{class:"emo"}, it.pic)));
  if(ex.listen) wrap.appendChild(el("button",{class:"listen", onclick:()=>speak(it.word)}, "🔊 Listen"));
  const opts = el("div",{class:"opts" + (ex.syl ? " syl":"")});
  const fb = fbBox();
  const btns = it.o.map((o,j) => el("button",{class:"opt", onclick:()=>choose(j)}, o));
  btns.forEach(b=>opts.appendChild(b));
  wrap.append(opts, fb);
  function paint(given){
    btns.forEach((b,j)=>{ b.disabled = true; if(j===it.a) b.classList.add("right"); else if(j===given) b.classList.add("wrong"); });
  }
  function fullSentence(){ return it.q && it.q.includes("___") ? it.q.replace("___", it.o[it.a].replace(/^-/,"")) : (it.word || it.o[it.a]); }
  function choose(j){
    if(S.ans[id] && S.ans[id].done) return;
    const ok = j === it.a;
    rec(id, {done:true, ok, given:it.o[j]});
    paint(j);
    if(it.gap) fillGap(it, ok);
    if(!ex.sort && !ex.syl && !ex.listen && it.q && it.q.includes("___")) qEl.querySelector("span:last-child").innerHTML = gapHtml(it.q, it.o[it.a].replace(/^-/,""));
    showFb(fb, ok, it.why, ok ? "" : `→ <b>${esc(it.o[it.a])}</b>`);
    if(ok){ if(it.say) speak(it.say); else if(it.word) speak(it.word); else if(!ex.tf) speak(fullSentence()); }
  }
  if(st && st.done){ paint(it.o.indexOf(st.given)); showFb(fb, st.ok, it.why, st.ok ? "" : `→ <b>${esc(it.o[it.a])}</b>`); }
  return wrap;
}

function typedItem(ex, it, i){
  const id = ex.id+"-"+i, wrap = el("div",{class:"item"});
  const isTr = ex.type === "translate";
  wrap.appendChild(qLine(i+1, isTr ? `🇷🇺 ${esc(it.q)}` : it.q.includes("___") ? gapHtml(it.q) : it.q));
  const inp = el("input",{type:"text", autocomplete:"off", autocapitalize:"off", spellcheck:"false", "aria-label":"answer", placeholder: isTr ? "Write in English" : "Type here"});
  const btn = el("button",{class:"btn", onclick:()=>check()}, "Check");
  const fb = fbBox();
  const selfRow = el("div",{class:"tilebtns", style:"display:none;margin-top:8px"});
  wrap.append(el("div",{class:"tin"}, inp, btn), fb, selfRow);
  inp.addEventListener("keydown", e=>{ if(e.key==="Enter") check(); });
  function lock(ok, given, extra){
    inp.disabled = true; btn.disabled = true; inp.value = given;
    inp.classList.remove("ok","no"); inp.classList.add(ok ? "ok" : "no");
    const modelShown = ok ? "" : `→ <b>${esc(it.model)}</b>`;
    showFb(fb, ok, it.why || "", (extra||"") + modelShown);
    if(ok) speak(it.q.includes("___") ? it.q.replace("___", it.model) : it.model);
  }
  function check(){
    const st = S.ans[id] || {};
    if(st.done) return;
    const v = inp.value.trim(); if(!v){ toast("Write your answer"); return; }
    const tries = (st.tries||0) + 1;
    const ok = matches(v, it.accept);
    let note = "";
    if(ok && /\?$/.test(it.model) && !/\?\s*$/.test(v)) note = "(Don't forget the question mark.) ";
    if(ok){ rec(id,{done:true, ok:true, given:v, tries}); lock(true, v, note); return; }
    if(tries < 2){ rec(id,{tries, given:v}); inp.classList.add("no"); fb.className="fb show no"; fb.innerHTML = `<b>${pick(OOPS)}</b> Try again.<span class="why">💡 ${it.hint}</span>`; inp.focus(); setTimeout(()=>inp.classList.remove("no"), 700); return; }
    if(isTr){
      rec(id,{tries, given:v});
      inp.disabled = true; btn.disabled = true;
      fb.className="fb show no"; fb.innerHTML = `<b>Compare:</b> ${esc(it.model)}<span class="why">If your version is also correct, tap “My answer is also correct”.</span>`;
      selfRow.style.display = "flex"; selfRow.innerHTML = "";
      selfRow.append(
        el("button",{class:"btn teal", onclick:()=>{ rec(id,{done:true, ok:true, self:true, given:v}); selfRow.style.display="none"; lock(true, v, "(self-checked) "); }}, "My answer is also correct ✓"),
        el("button",{class:"btn alt", onclick:()=>{ rec(id,{done:true, ok:false, given:v}); selfRow.style.display="none"; lock(false, v); }}, "OK, I see"));
      return;
    }
    rec(id,{done:true, ok:false, given:v, tries}); lock(false, v);
  }
  const st = S.ans[id];
  if(st && st.done) lock(st.ok, st.given, st.self ? "(self-checked) " : "");
  else if(st && st.given) inp.value = st.given;
  return wrap;
}

function tilesItem(ex, it, i){
  const id = ex.id+"-"+i, wrap = el("div",{class:"item"});
  const words = it.a.split(" ");
  wrap.appendChild(qLine(i+1, `<span class="ru-i">🇷🇺 ${esc(it.ru)}</span>`));
  const line = el("div",{class:"line", "aria-label":"your sentence"}), pool = el("div",{class:"pool"}), fb = fbBox();
  let order = shuffle(words.map((w,k)=>k)); if(order.every((k,j)=>k===j)) order = order.reverse();
  const chosen = [];
  const draw = () => {
    line.innerHTML = ""; pool.innerHTML = "";
    chosen.forEach((k,pos)=>line.appendChild(el("button",{class:"tile", onclick:()=>{ if(done()) return; chosen.splice(pos,1); draw(); }}, words[k])));
    order.filter(k=>!chosen.includes(k)).forEach(k=>pool.appendChild(el("button",{class:"tile", onclick:()=>{ if(done()) return; chosen.push(k); draw(); }}, words[k])));
  };
  const done = () => S.ans[id] && S.ans[id].done;
  const bCheck = el("button",{class:"btn", onclick:()=>check()}, "Check");
  const bClear = el("button",{class:"btn alt", onclick:()=>{ if(done()) return; chosen.length=0; draw(); }}, "Clear");
  wrap.append(line, pool, el("div",{class:"tilebtns"}, bCheck, bClear), fb);
  function finish(ok, given){
    bCheck.disabled = true; bClear.disabled = true;
    line.innerHTML = ""; it.a.split(" ").forEach(w=>line.appendChild(el("span",{class:"tile", style: ok ? "background:var(--teal);color:#fff" : ""}, w))); pool.innerHTML = "";
    showFb(fb, ok, "", ok ? "" : `→ <b>${esc(it.a)}</b><span class="why">Your answer: ${esc(given)}</span>`);
    if(ok) speak(it.a);
  }
  function check(){
    if(done()) return;
    if(chosen.length !== words.length){ toast("Use all the words"); return; }
    const given = chosen.map(k=>words[k]).join(" ");
    const tries = ((S.ans[id]||{}).tries||0) + 1;
    if(norm(given) === norm(it.a)){ rec(id,{done:true, ok:true, given, tries}); finish(true, given); return; }
    if(tries < 2){ rec(id,{tries, given}); fb.className="fb show no"; fb.innerHTML = `<b>${pick(OOPS)}</b> Try again.<span class="why">💡 The first word is: <b>${esc(words[0])}</b></span>`; return; }
    rec(id,{done:true, ok:false, given, tries}); finish(false, given);
  }
  if(done()) finish(S.ans[id].ok, S.ans[id].given); else draw();
  return wrap;
}

function matchEx(ex){
  const box = el("div",{class:"match"}), L = el("div",{class:"col"}), R = el("div",{class:"col"});
  const fb = el("div",{class:"fb", style:"margin-left:0"});
  let sel = null;
  const rights = shuffle(ex.pairs.map((p,i)=>i));
  const lb = ex.pairs.map((p,i)=>el("button",{class:"mt", onclick:()=>{ if(isDone(i)) return; sel=i; lb.forEach(b=>b.classList.remove("sel")); lb[i].classList.add("sel"); speak(p[0]); }}, "🔊 "+p[0]));
  const rb = {};
  rights.forEach(i=>{ rb[i] = el("button",{class:"mt", onclick:()=>tapR(i)}, ex.pairs[i][1]); });
  const isDone = (i) => S.ans[ex.id+"-"+i] && S.ans[ex.id+"-"+i].done;
  function tapR(i){
    if(sel===null){ toast(ex.leftHint || "First tap an English word"); return; }
    if(isDone(i)) return;
    const id = ex.id+"-"+sel, st = S.ans[id] || {};
    if(i === sel){
      rec(id,{done:true, ok:!st.wrong, given: ex.pairs[i][1]});
      lb[sel].classList.remove("sel"); lb[sel].classList.add("done"); rb[i].classList.add("done");
      showFb(fb, true, `${ex.pairs[i][0]}${ex.sep || " = "}${ex.pairs[i][1]}`); sel = null;
    } else {
      rec(id,{wrong:(st.wrong||0)+1, given: ex.pairs[i][1]});
      rb[i].classList.add("shake"); setTimeout(()=>rb[i].classList.remove("shake"), 400);
      showFb(fb, false, "Try another one");
    }
  }
  lb.forEach((b,i)=>{ if(isDone(i)){ b.classList.add("done"); rb[i].classList.add("done"); } });
  lb.forEach(b=>L.appendChild(b)); rights.forEach(i=>R.appendChild(rb[i]));
  box.append(L,R);
  return el("div",{}, box, fb);
}

function writeEx(ex){

/* ================= RESULTS & REPORT ================= */
function rankFor(p){
  if(p >= 95) return ["🏆 Chief city planner","Flawless, the city is yours!"];
  if(p >= 80) return ["🏙️ Architect","Excellent work. Review the few slips below."];
  if(p >= 50) return ["🧱 Builder","Good foundation. Go over your mistakes and the rules."];
  return ["📐 Apprentice","Re-read the rules and try the steps again."];
}
function mistakes(){
  const out = [];
  for(const ex of EX){
    if(ex.type === "write") continue;
    const n = itemCount(ex);
    for(let i=0;i<n;i++){
      const a = S.ans[ex.id+"-"+i]; if(!a || !a.done || a.ok) continue;
      let q, right;
      if(ex.type==="match"){ q = ex.pairs[i][0]; right = ex.pairs[i][1]; }
      else { const it = ex.items[i]; q = it.q || it.word || it.ru || ""; right = ex.type==="choice" ? it.o[it.a] : (it.model || it.a); }
      out.push({ex:ex.title, q:q.replace(/<[^>]+>/g,""), given:a.given || "—", right});
    }
  }
  return out;
}
function report(){
  const t = totals(), pct = t.n ? Math.round(t.ok/t.n*100) : 0;
  const L = [];
  L.push(`HOMEWORK: ${TOPIC}`);
  L.push(`Student: ${S.name}`);
  L.push(`Date: ${new Date().toLocaleDateString("en-GB")}`);
  L.push(`Score: ${t.ok}/${t.n} (${pct}%) — answered ${t.done}/${t.n}`);
  L.push(`Flashcards known: ${Object.keys(S.known).length}/${WORDS.length}`);
  L.push("");
  L.push("BY EXERCISE:");
  for(const ex of EX.filter(scorable)){ const s = exScore(ex); L.push(`- ${ex.title}: ${s.ok}/${s.n}${s.done<s.n ? ` (not finished: ${s.done}/${s.n})` : ""}`); }
  const m = mistakes();
  L.push(""); L.push(`MISTAKES (${m.length}):`);
  m.forEach(x=>L.push(`- [${x.ex}] ${x.q} → wrote: ${x.given} | correct: ${x.right}`));
  const selfs = Object.entries(S.ans).filter(([k,v])=>v.self);
  if(selfs.length){ L.push(""); L.push("SELF-CHECKED TRANSLATIONS (please check):"); selfs.forEach(([k,v])=>{ const ex = EX.find(e=>k.startsWith(e.id+"-")); const it = ex.items[+k.split("-")[1]]; L.push(`- ${it.q} → ${v.given}`); }); }
  L.push(""); L.push("ALL TYPED ANSWERS:");
  for(const ex of EX.filter(e=>["typed","translate","tiles"].includes(e.type))){ ex.items.forEach((it,i)=>{ const a = S.ans[ex.id+"-"+i]; if(a && a.given) L.push(`- ${(it.q||it.ru).replace(/<[^>]+>/g,"")} → ${a.given}${a.done ? (a.ok ? " ✓" : " ✗") : ""}`); }); }
  if(EX.some(e=>e.type==="write")){ L.push(""); L.push("WRITING:"); }
  for(const ex of EX.filter(e=>e.type==="write")){ L.push(`${ex.title}:`); L.push((S.write[ex.id]||"").trim() || "(empty)"); L.push(""); }
  return L.join("\n");
}

  const ml = el("div",{class:"mlist"});
  if(!m.length) ml.appendChild(el("div",{}, t.done ? "No mistakes — amazing!" : "Nothing here yet"));
  m.forEach(x=>ml.appendChild(el("div",{html:`<b>${esc(x.q)}</b><br><span class="bad">${esc(x.given)}</span> → <span class="good">${esc(x.right)}</span>`})));
  p.appendChild(el("div",{class:"card"}, el("h3",{}, "Mistakes to remember"), ml));
  const w = EX.filter(e=>e.type==="write").map(ex => el("div",{style:"margin-bottom:8px"}, el("b",{}, ex.title), el("div",{style:"white-space:pre-wrap"}, (S.write[ex.id]||"").trim() || "— (empty)")));
  if(w.length) p.appendChild(el("div",{class:"card"}, el("h3",{}, "Your writing"), ...w));
  // send
  const rep = report(), subj = `${TOPIC} — ${S.name} — ${t.ok}/${t.n}`, sh = short(rep);
  const send = el("div",{class:"send"});
  if(navigator.share) send.appendChild(el("button",{class:"s-share", onclick:()=>{ navigator.share({title:subj, text:rep}).catch(()=>{}); }}, "📤 Share"));
  send.append(
    el("a",{class:"s-gm", target:"_blank", rel:"noopener", href:`https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(TEACHER)}&su=${encodeURIComponent(subj)}&body=${encodeURIComponent(sh)}`}, "Send in Gmail"),
    el("a",{class:"s-tg", target:"_blank", rel:"noopener", href:`https://t.me/share/url?url=${encodeURIComponent(subj)}&text=${encodeURIComponent(sh)}`}, "Telegram"),
    el("a",{class:"s-wa", target:"_blank", rel:"noopener", href:`https://wa.me/?text=${encodeURIComponent(subj+"\n"+sh)}`}, "WhatsApp"),
    el("a",{class:"s-ml", href:`mailto:${TEACHER}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(sh)}`}, "✉️ Email app"),
    el("button",{class:"s-cp", onclick:()=>copy(rep)}, "📋 Copy text"));
  p.appendChild(el("div",{class:"card"}, el("h3",{}, "Send to your teacher"),
    el("p",{html:`Teacher's email: <span class="email">${TEACHER}</span>`}),
    el("p",{class:"muted", style:"font-size:14px"}, "Gmail, Telegram, WhatsApp and Email send a short version. “Share” and “Copy text” give the full report."),
    send, el("details",{style:"margin-top:10px"}, el("summary",{}, "Show the report"), el("pre",{style:"white-space:pre-wrap;font-size:13px;background:var(--tint);padding:10px;border-radius:10px"}, rep))));
  // reset
  const conf = el("div",{class:"confirm"}, el("b",{}, "Delete all answers?"),
    el("button",{class:"btn", style:"background:var(--crim)", onclick:()=>{ S = {name:S.name, ans:{}, known:{}, write:{}, tab:"rules"}; save(); location.reload(); }}, "Yes"),
    el("button",{class:"btn alt", onclick:()=>conf.classList.remove("show")}, "No"));
  p.appendChild(el("div",{class:"card"}, el("button",{class:"btn alt", onclick:()=>conf.classList.add("show")}, "↺ Start again"), conf));
}
function copy(txt){
  const ok = () => toast("Copied!");
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(txt).then(ok).catch(fallback); } else fallback();
  function fallback(){ const ta = el("textarea",{style:"position:fixed;top:-1000px"}); ta.value = txt; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); ok(); }catch(e){ toast("Select and copy the report below"); } ta.remove(); }
}

/* ================= INIT ================= */
function init(){
  const nmI = $("#nm"); nmI.value = S.name || DEFAULT_NAME; $("#hname").textContent = nmI.value || DEFAULT_NAME;
  nmI.addEventListener("input", ()=>{ S.name = nmI.value.trim() || DEFAULT_NAME; $("#hname").textContent = S.name; save(); });
  renderTabs();
  renderRules(); renderWords(); renderCards();
  renderCase("st1","🅰️","st2"); renderCase("st2","🏙️","st3"); renderCase("st3","📰","res");
  panel("res","🏆","Results","");
  const start = TABS.some(t=>t.id===S.tab) ? S.tab : "rules";
  document.querySelectorAll("section.panel").forEach(p => p.classList.toggle("on", p.id === "p-"+start));
  document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("on", b.dataset.id === start));
  if(start === "res") renderResults();
  refresh();
}
init();
</script>
